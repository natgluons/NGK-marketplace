version: '3'
services:
  app:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - '.:/app'
      - '/app/node_modules'
    environment:
      - CHOKIDAR_USEPOLLING=true  # Important for hot reload
      - NODE_ENV=development
      - HOST=0.0.0.0
    stdin_open: true  # Docker equivalent of -i
    tty: true        # Docker equivalent of -t